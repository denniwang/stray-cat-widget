name: Release

# Push a tag like v1.2.0 and this builds the app and publishes it as the newest release.
# The site's download button points at releases/latest, so it follows automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        env:
          TAG: ${{ github.ref_name }}
        run: VERSION="${TAG#v}" ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" build/StrayCat.zip build/StrayCat.zip.sha256 --title "Stray Cat $TAG" --generate-notes
      - name: Update the Homebrew cask
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          SHA="$(awk '{print $1}' build/StrayCat.zip.sha256)"
          git fetch origin main
          git checkout main
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/straycat.rb
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "straycat ${VERSION}" || exit 0
          git push origin main
